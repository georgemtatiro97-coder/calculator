<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="mtatix.css">
</head>
<body>
    <h1 id="head"> Mtatix's Calculator</h1>
    <div id="calculator">
        <input type="text" readonly id="display" value="">

        <div id="keys">
            <button type="button" onclick="clearDisplay()">C</button>
            <button type="button" onclick="backspace()">&#9003</button>
            <button type="button" onclick="appendToDisplay('(')" class="operator">(</button>
            <button type="button" onclick="appendToDisplay(')')" class="operator">)</button>

            <button type="button" onclick="appendToDisplay('7')">7</button>
            <button type="button" onclick="appendToDisplay('8')">8</button>
            <button type="button" onclick="appendToDisplay('9')">9</button>
            <button type="button" onclick="appendToDisplay('+')" class="operator">+</button>

            <button type="button" onclick="appendToDisplay('4')">4</button>
            <button type="button" onclick="appendToDisplay('5')">5</button>
            <button type="button" onclick="appendToDisplay('6')">6</button>
            <button type="button" onclick="appendToDisplay('-')" class="operator">-</button>

            <button type="button" onclick="appendToDisplay('1')">1</button>
            <button type="button" onclick="appendToDisplay('2')">2</button>
            <button type="button" onclick="appendToDisplay('3')">3</button>
            <button type="button" onclick="appendToDisplay('*')" class="operator">*</button>

            <button type="button" onclick="appendToDisplay('0')">0</button>
            <button type="button" onclick="appendToDisplay('.')">.</button>
            <button type="button" onclick="toggleSign()">±</button>
            <button type="button" onclick="appendToDisplay('/')" class="operator">/</button>

            <button type="button" onclick="appendToDisplay('π')">π</button>
            <button type="button" onclick="appendToDisplay('e')">e</button>
            <button type="button" onclick="appendToDisplay('^')">xʸ</button>
            <button type="button" onclick="applyPercentage()">%</button>

            <button type="button" onclick="square()">x²</button>
            <button type="button" onclick="sqrtValue()">√x</button>
            <button type="button" onclick="memoryStore()">MS</button>
            <button type="button" onclick="memoryRecall()">MR</button>
        
            <button type="button" onclick="memoryClear()">MC</button>
            <button type="button" onclick="calculate()">=</button>
            <button type="button" onclick="appendToDisplay('^')">^</button>
            <button type="button" onclick="appendToDisplay('')"></button>
        </div>
    </div>

    <script src="george.js"></script>
</body>
</html>
